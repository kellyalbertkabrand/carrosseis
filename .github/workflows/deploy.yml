name: Publicar dashboard na Netlify

on:
  push:
    branches:
      - claude/activity-control-notifications-F2SrW
    paths:
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy
        env:
          PROXY: "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..-XNrHq6-Iwt91qqS.BHYgC1uO0Zn7oeeRM__iOSAPA88uAh7UJIeX7_dliaTMrF3PKK0v7bxKs8w.gs8v-5elBHC8nioBz0czAg"
        run: npx -y @netlify/mcp@latest --site-id b1c53543-3590-45c4-9061-c1d4383eb39e --proxy-path "$PROXY"
